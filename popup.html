<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>МЫШЬ 2.1</title>
  <style>
    body { width: 350px; padding: 10px; }
    button { width: 100%; padding: 10px; margin: 10px 0; }
    #status { margin-top: 10px; white-space: pre-wrap; }
    #useLessonDateRange { margin: 0px; padding: 0px; }
  </style>
</head>
<body>
  <h1>МЫШЬ 2.1</h1>
  <span>Поддержать автора - кошелек ЮMoney: 4100 1195 1823 6176</span>
  <button id="startBtn">Без ДЗ на все даты</button>
  <button id="syncKTP">Синхронизация KTP</button>
  <div style="margin: 10px 0px;">
    <label >
      <input type="checkbox" id="useLessonDateRange">
      Выбрать диапазон дат уроков
    </label>
    <div style="display: none; gap: 8px;" id="lessonDateRange">
      <label style="flex: 1;">
        От:<input type="date" id="lessonDateFrom" style="width: 80%;">
      </label>
      <label style="flex: 1;">
        До:<input type="date" id="lessonDateTo" style="width: 80%;">
      </label>
    </div>
  </div>
  
  <select id="groupSelect" style="width: 100%; height: 40px;">
  </select>
  <button id="setMarks">Выставлять оценки</button>
  
  <hr style="margin: 15px 0;">
  <h3>Добавить ДЗ на диапазон дат</h3>
  
  <label style="display: block; margin: 5px 0;">
    Описание:
    <textarea id="hwDescription" style="width: 100%; height: 60px;" placeholder="Повторить материал пройденный на занятиях https://metanit.com/">Повторить материал пройденный на занятиях https://metanit.com/</textarea>
  </label>
  
  <div style="display: flex; gap: 8px; margin: 5px 0;">
    <label style="flex: 1;">
    С:
    <input type="date" id="hwDateFrom" style="width: 100%;">
    </label>
    <label style="flex: 1;">
    По:
    <input type="date" id="hwDateTo" style="width: 100%;">
    </label>
  </div>
  
  <button id="addHomeworkBtn">Добавить ДЗ на диапазон</button>
  
  <progress id="progressBar" value="0" max="100" style="width: 100%; height: 40px;"> 0% </progress>
  
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
